name: AI Project CI/CD

# Kích hoạt luồng này mỗi khi bạn đẩy code lên nhánh main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Đây chính là "Tác nhân xây dựng tạm thời" (Ephemeral Build Agent)
    # GitHub sẽ cấp cho bạn một máy chủ Ubuntu sạch sẽ hoàn toàn
    runs-on: ubuntu-latest

    steps:
    # 1. Kéo code của bạn từ GitHub về máy ảo tạm thời
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Xây dựng Docker Image từ code của bạn
    - name: Build Docker Image
      run: docker build -t my-ai-app:${{ github.sha }} .

    # 3. Chạy file test bên trong Container
    # Lệnh --rm đảm bảo container sẽ bị "tiêu hủy" ngay sau khi chạy xong
    - name: Run Tests in Container
      run: docker run --rm my-ai-app:${{ github.sha }} python test_model.py